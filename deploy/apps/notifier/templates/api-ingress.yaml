apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: notifier-api
  labels:
    app.kubernetes.io/name: notifier-api
    app.kubernetes.io/part-of: notifier
  annotations:
    cert-manager.io/cluster-issuer: hackathon-ca
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "api.{{ .Values.domain }}"
      secretName: notifier-api-tls
  rules:
    - host: "api.{{ .Values.domain }}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: notifier-api-stable
                port:
                  number: 80
