apiVersion: v1
kind: Service
metadata:
  name: notifier-api-stable
  labels:
    app.kubernetes.io/name: notifier-api
    app.kubernetes.io/instance: notifier-api-stable
    app.kubernetes.io/part-of: notifier
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: notifier-api
---
apiVersion: v1
kind: Service
metadata:
  name: notifier-api-canary
  labels:
    app.kubernetes.io/name: notifier-api
    app.kubernetes.io/instance: notifier-api-canary
    app.kubernetes.io/part-of: notifier
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: notifier-api
