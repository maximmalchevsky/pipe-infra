apiVersion: v1
kind: ConfigMap
metadata:
  name: notifier-dashboard
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: notifier
    app.kubernetes.io/part-of: notifier
data:
  notifier-dashboard.json: |-
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "id": 1,
          "title": "Queue Pending",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "notifier_queue_pending{namespace=\"notifier\"}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "Worker Replicas",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "kube_deployment_status_replicas{namespace=\"notifier\",deployment=\"notifier-worker\"}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "API Replicas",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(kube_pod_status_phase{namespace=\"notifier\",pod=~\"notifier-api.*\",phase=\"Running\"})",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "5xx Ratio",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(http_requests_total{namespace=\"notifier\",code=~\"5..\"}[1m])) / sum(rate(http_requests_total{namespace=\"notifier\"}[1m]))",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "title": "Messages Processed Rate by Result",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(notifier_messages_processed_total{namespace=\"notifier\"}[1m])) by (result)",
              "legendFormat": "{{`{{result}}`}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "title": "API RPS by Version",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(http_requests_total{namespace=\"notifier\"}[1m])) by (version)",
              "legendFormat": "{{`{{version}}`}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "title": "API p95 by Version",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 12 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{namespace=\"notifier\"}[5m])) by (le, version))",
              "legendFormat": "{{`{{version}}`}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 8,
          "title": "Canary vs Stable RPS",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 20 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (exported_service) (rate(nginx_ingress_controller_requests{exported_service=~\"notifier-api-(stable|canary)\"}[1m]))",
              "legendFormat": "{{`{{exported_service}}`}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 9,
          "title": "Canary vs Stable 5xx Ratio",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 20 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (exported_service) (rate(nginx_ingress_controller_requests{exported_service=~\"notifier-api-(stable|canary)\",status=~\"5..\"}[1m])) / sum by (exported_service) (rate(nginx_ingress_controller_requests{exported_service=~\"notifier-api-(stable|canary)\"}[1m]))",
              "legendFormat": "{{`{{exported_service}}`}}",
              "refId": "A"
            }
          ]
        }
      ],
      "refresh": "5s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["notifier", "sms"],
      "time": { "from": "now-15m", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "Notifier Overview",
      "uid": "notifier-overview",
      "version": 1
    }
