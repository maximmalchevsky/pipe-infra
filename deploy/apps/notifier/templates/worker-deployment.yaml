apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifier-worker
  labels:
    app.kubernetes.io/name: notifier-worker
    app.kubernetes.io/part-of: notifier
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: notifier-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notifier-worker
        app.kubernetes.io/part-of: notifier
    spec:
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds | default 45 }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: notifier-worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          command:
            - /usr/local/bin/notifier-worker
          env:
            - name: APP_VERSION
              value: {{ .Values.image.tag | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notifier-db-credentials
                  key: password
            - name: DATABASE_URL
              value: "postgres://notifier:$(DB_PASSWORD)@notifier-db-rw.notifier.svc:5432/notifier?sslmode=require"
            - name: BATCH_SIZE
              value: {{ .Values.worker.batchSize | default 100 | quote }}
            - name: BATCH_TIMEOUT
              value: {{ .Values.worker.batchTimeout | default "30s" | quote }}
            - name: SEND_LATENCY_MS
              value: {{ .Values.worker.sendLatencyMs | default 20 | quote }}
            - name: SEND_FAIL_RATE
              value: {{ .Values.worker.sendFailRate | default "0.01" | quote }}
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: {{ .Values.worker.resources.requests.cpu | default "50m" }}
              memory: {{ .Values.worker.resources.requests.memory | default "32Mi" }}
            limits:
              memory: {{ .Values.worker.resources.limits.memory | default "128Mi" }}
