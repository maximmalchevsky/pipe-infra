# VMs are disposable and recreated by Terraform, so host keys are not pinned.
[defaults]
inventory = infra/ansible/inventory/terraform.sh
roles_path = infra/ansible/roles:infra/ansible/kube/roles
remote_user = ubuntu
host_key_checking = False
interpreter_python = /usr/bin/python3
stdout_callback = default

[callback_default]
result_format = yaml

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no
