---
- name: Ensure local kubeconfig directory exists
  ansible.builtin.file:
    path: "{{ kubeconfig_local_path | dirname }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Fetch admin.conf to local kubeconfig path
  ansible.builtin.fetch:
    src: "{{ kubeconfig_remote_path }}"
    dest: "{{ kubeconfig_local_path }}"
    flat: true

- name: Set secure mode 0600 on local kubeconfig
  ansible.builtin.file:
    path: "{{ kubeconfig_local_path }}"
    mode: "0600"
  delegate_to: localhost
  become: false

- name: Display kubectl export hint
  ansible.builtin.debug:
    msg: "kubectl --kubeconfig .kube/config get nodes"
