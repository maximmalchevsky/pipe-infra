# ============================================================
# Online — настройка репозиториев и установка
# ============================================================

- name: Docker repository for containerd RedHat
  when:
      - ansible_facts['os_family'] == "RedHat"
      - k8s_install_mode == "online"
  ansible.builtin.yum_repository:
      name: docker-ce-stable
      enabled: true
      baseurl: "https://download.docker.com/linux/centos/$releasever/$basearch/stable"
      description: "Docker CE Stable - $basearch"
      gpgcheck: true
      gpgkey:
          - "https://download.docker.com/linux/centos/gpg"

- name: Docker repository for Ubuntu [Key]
  when:
      - ansible_facts['os_family'] == "Debian"
      - k8s_install_mode == "online"
  ansible.builtin.apt_key:
      url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
      state: present
      keyring: /etc/apt/trusted.gpg.d/docker.gpg

- name: Docker repository for Ubuntu
  when:
      - ansible_facts['os_family'] == "Debian"
      - ansible_facts['distribution'] == "Ubuntu"
      - k8s_install_mode == "online"
  ansible.builtin.apt_repository:
      repo: >
          deb [signed-by=/etc/apt/trusted.gpg.d/docker.gpg]
          https://download.docker.com/linux/{{ ansible_distribution | lower }}
          {{ ansible_distribution_release }} stable
      state: present
      filename: docker-ce-stable

- name: Install containerd [rpm, online]
  when:
      - ansible_facts['os_family'] == "RedHat"
      - k8s_install_mode == "online"
  ansible.builtin.dnf:
      name:
          - containerd.io
      state: present

- name: Install containerd [deb, online]
  when:
      - ansible_facts['os_family'] == "Debian"
      - k8s_install_mode == "online"
  ansible.builtin.apt:
      name:
          - containerd
      state: present

# ============================================================
# Offline — установка из локальных пакетов
# ============================================================

- name: Скопировать пакеты containerd [offline]
  when: k8s_install_mode == "offline"
  ansible.builtin.copy:
      src: "{{ item }}"
      dest: "{{ k8s_packages_remote_dir }}/"
      mode: "0644"
  with_fileglob:
      - "{{ playbook_dir }}/{{ k8s_offline_dir }}/cri/containerd/*.rpm"
      - "{{ playbook_dir }}/{{ k8s_offline_dir }}/cri/containerd/*.deb"

- name: Установить containerd из RPM [RedHat, offline]
  when:
      - ansible_facts['os_family'] == "RedHat"
      - k8s_install_mode == "offline"
  ansible.builtin.command: >
      dnf install -y {{ k8s_packages_remote_dir }}/containerd*.rpm
  args:
      creates: /usr/bin/containerd

- name: Установить containerd из DEB [Debian, offline]
  when:
      - ansible_facts['os_family'] == "Debian"
      - k8s_install_mode == "offline"
  ansible.builtin.command: >
      apt install -y --allow-downgrades {{ k8s_packages_remote_dir }}/containerd*.deb
  args:
      creates: /usr/bin/containerd

- name: Create /etc/containerd directory
  ansible.builtin.file:
      path: /etc/containerd
      state: directory
      mode: "0755"

- name: Enable dockerhub mirror on containerd [mkdir certs.d]
  ansible.builtin.file:
      path: /etc/containerd/certs.d
      state: directory
      mode: "0755"

- name: Enable dockerhub mirror on containerd [mkdir docker.io]
  when: dockerhubMirror is true
  ansible.builtin.file:
      path: /etc/containerd/certs.d/docker.io
      state: directory
      mode: "0755"

- name: Enable dockerhub mirror on containerd [file hosts.toml]
  when: dockerhubMirror is true
  ansible.builtin.template:
      src: hosts.j2
      dest: /etc/containerd/certs.d/docker.io/hosts.toml
      owner: root
      mode: '0644'
  notify: restart containerd

- name: Получить containerd default config
  ansible.builtin.command: containerd config default
  register: containerd_default_config
  changed_when: false

- name: Настроить /etc/containerd/config.toml
  ansible.builtin.copy:
    content: |
      {%- set cgroup_re = "(?m)^(\\s*SystemdCgroup\\s*=\\s*)false\\b" -%}
      {%- set registry_re = "(\\[plugins\\.[^\\]]*registry[^\\]]*\\][^\\[]*?config_path\\s*=\\s*)(\"\"|'')" -%}
      {%- set sandbox_img_re = "(?m)^(\\s*sandbox_image\\s*=\\s*)[\"'].*?[\"']" -%}
      {%- set sandbox_re = "(?m)^(\\s*sandbox\\s*=\\s*)[\"'].*?[\"']" -%}
      {%- set cfg = containerd_default_config.stdout
        | regex_replace(cgroup_re, '\\1true')
        | regex_replace(registry_re, '\\1"/etc/containerd/certs.d"') -%}
      {%- if sandbox_image is defined -%}
      {%- set cfg = cfg
        | regex_replace(sandbox_img_re, '\\1"' ~ sandbox_image ~ '"')
        | regex_replace(sandbox_re, '\\1"' ~ sandbox_image ~ '"') -%}
      {%- endif -%}
      {{ cfg }}
    dest: /etc/containerd/config.toml
    owner: root
    group: root
    mode: '0644'
  notify: restart containerd

- name: Enable and start Containerd service
  ansible.builtin.service:
    name: containerd
    state: started
    enabled: true
